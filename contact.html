<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Yasmin Islam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Contact Me</h1>

    <form id="contactForm">

        <!-- Full Name -->
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>

        <!-- Email -->
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <!-- Subject -->
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="Subject">

        <!-- Message -->
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Write your message"></textarea>

        <!-- Project Type -->
        <fieldset>
            <legend>Project Type</legend>

            <div class="radio-group">
                <input type="radio" id="cloud" name="project_type" value="cloud">
                <label for="cloud">Cloud Setup</label>
            </div>

            <div class="radio-group">
                <input type="radio" id="devops" name="project_type" value="devops">
                <label for="devops">DevOps Automation</label>
            </div>

            <div class="radio-group">
                <input type="radio" id="website" name="project_type" value="website" required>
                <label for="website">Website Development</label>
            </div>
        </fieldset>

        <button type="submit">Send Message</button>
        <div id="formOutput"></div>

    </form>

    <a href="index.html" class="btn">Back Home</a>

</div>
<script src="script.js"></script>
</body>
</html>
